<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memuat… – GWM</title><meta name="robots" content="noindex">
<!-- 404.html: GitHub Pages menampilkan file ini untuk alamat yang belum ada.
     Untuk alamat blog/<kategori>/<alamat>, tulisan terbit dibaca langsung dari Supabase,
     jadi tulisan baru bisa dibuka sebelum sinkron membuat halaman statisnya.
     Aturan render HARUS sama dengan tools/blog.py dan js/admin-blog.js. -->
<script>
(function(){
var P=location.pathname,M=P.match(/^(.*\/)blog\/([a-z0-9-]+)\/([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/);
var BASE=M?M[1]:(P.match(/^\/[^\/]+\//)&&location.hostname.slice(-10)==="github.io"?P.match(/^\/[^\/]+\//)[0]:"/");
window.__B=BASE;window.__M=M;
document.write('<script src="'+BASE+'js/theme.js"><\/script><link rel="stylesheet" href="'+BASE+'css/style.css"><link rel="stylesheet" href="'+BASE+'css/blog.css"><link rel="icon" href="'+BASE+'assets/favicon.svg" type="image/svg+xml">');
})();
</script></head>
<body class="bl"><div id="app"></div>
<script>
(function(){
var B=window.__B,M=window.__M,app=document.getElementById("app");
var CATS=[["berita","Berita"],["opini","Opini & Cerita"],["gaya-hidup","Gaya Hidup"],["hiburan","Hiburan"],["wisata","Wisata"],["teknologi","Teknologi"],["tips","Tips & Panduan"],["panduan-konser","Panduan Konser"],["tips-gunung","Tips Gunung"],["review","Review"],["komunitas","Komunitas"]],CN={};
CATS.forEach(function(c){CN[c[0]]=c[1]});
var MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#x27;"}[c]})}
function fd(s){var t=Date.parse(s);if(isNaN(t))return"";var d=new Date(t+7*36e5);return d.getUTCDate()+" "+MON[d.getUTCMonth()]+" "+d.getUTCFullYear()}
/* ---- mode Teks ---- */
function inl(t){return t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" rel="noopener nofollow">$1</a>')}
function t2h(b){var out=[],para=[],lst=[];
  function fp(){if(para.length){out.push("<p>"+para.map(function(x){return inl(esc(x))}).join("<br>")+"</p>");para=[]}}
  function fl(){if(lst.length){out.push("<ul>"+lst.map(function(x){return"<li>"+inl(esc(x))+"</li>"}).join("")+"</ul>");lst=[]}}
  b.replace(/\r\n?/g,"\n").split("\n").forEach(function(line){
    if(!line.trim()){fp();fl()}
    else if(line.indexOf("## ")===0){fp();fl();out.push("<h2>"+inl(esc(line.slice(3).trim()))+"</h2>")}
    else if(line.indexOf("### ")===0){fp();fl();out.push("<h3>"+inl(esc(line.slice(4).trim()))+"</h3>")}
    else if(line.indexOf("- ")===0){fp();lst.push(line.slice(2).trim())}
    else{fl();para.push(line.trim())}});
  fp();fl();return out.join("")}
/* ---- mode HTML ---- */
var OK={P:1,BR:1,H2:1,H3:1,H4:1,UL:1,OL:1,LI:1,STRONG:1,B:1,EM:1,I:1,U:1,A:1,BLOCKQUOTE:1,CODE:1,PRE:1,HR:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1},
    DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,TEMPLATE:1,NOSCRIPT:1,SVG:1,MATH:1,FORM:1,TEXTAREA:1,SELECT:1,BUTTON:1,HEAD:1,TITLE:1};
function safeHref(v){v=String(v||"").replace(/[\x00-\x20]+/g,"");return/^(https?:\/\/|mailto:|\/|#|\.\/|\.\.\/)/i.test(v)?v:""}
function walk(n){if(n.nodeType===3)return esc(n.nodeValue);if(n.nodeType!==1)return"";var t=n.tagName;if(DROP[t])return"";
  var inner=[].map.call(n.childNodes,walk).join("");if(!OK[t])return inner;t=t.toLowerCase();
  if(t==="br"||t==="hr")return"<"+t+">";
  if(t==="a"){var h=safeHref(n.getAttribute("href"));return h?'<a href="'+esc(h)+'" rel="noopener nofollow">'+inner+"</a>":"<a>"+inner+"</a>"}
  return"<"+t+">"+inner+"</"+t+">"}
function sanitize(h){return walk(new DOMParser().parseFromString("<body>"+h+"</body>","text/html").body)}
/* ---- kerangka halaman ---- */
function top(cur){
  var chips='<a href="'+B+'blog/">Semua</a>'+CATS.map(function(c){return'<a href="'+B+'blog/'+c[0]+'/"'+(cur===c[0]?' aria-current="page"':"")+">"+esc(c[1])+"</a>"}).join("");
  return'<header class="bl-top"><div class="wrap"><a class="logo" href="'+B+'id/"><img src="'+B+'assets/favicon.svg" alt="" width="24" height="24">GWM</a><span class="sp"></span><a class="bl-l" href="'+B+'blog/">Blog</a><a class="bl-l" href="'+B+'id/event">Event</a><a class="bl-l" href="'+B+'id/gunung">Gunung</a></div></header><nav class="bl-cats wrap" aria-label="Kategori blog">'+chips+"</nav>"}
var FOOT='<footer class="bl-foot wrap"><span>GWM oleh Jurkon Studio</span><a href="'+B+'id/bantuan">Bantuan</a><a href="'+B+'id/terms">Syarat</a><a href="'+B+'id/privacy">Privasi</a></footer>';
function show(cur,main,title){document.title=title+" – GWM";app.innerHTML=top(cur)+'<main class="wrap bl-main">'+main+"</main>"+FOOT}
var EN=/\/en\//.test(location.pathname),T=EN?{h:"Page not found",s:"You are lost on the mountain. While you find the trail, hop the rocks: tap or Space to jump, hold the lower half or \u2193 to duck.",a:"Hiking game",b:"Go to blog",c:"Go to home",go:"Tap or press Space to start",oops:"Slipped! Tap to retry",pz:"Paused \u2013 tap to resume",hi:"Best ",ps:"Passed "}:{h:"Halaman tidak ditemukan",s:"Kamu tersesat di gunung. Sambil cari jalan, lompati batu-batunya: ketuk atau spasi untuk lompat, tahan separuh bawah layar atau \u2193 untuk merunduk.",a:"Game mendaki",b:"Ke halaman blog",c:"Ke beranda",go:"Ketuk atau tekan spasi untuk mulai",oops:"Kepleset! Ketuk untuk mengulang",pz:"Jeda \u2013 ketuk untuk lanjut",hi:"Tertinggi ",ps:"Melewati "};
function notFound(cur){show(cur,"<h1>"+T.h+'</h1><p class="bl-sub">'+T.s+'</p><canvas id="g" style="display:block;width:100%;max-width:600px;aspect-ratio:10/3;margin:18px auto;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none" role="img" aria-label="'+T.a+'"></canvas><p class="bl-cta"><a class="btn" href="'+B+'blog/">'+T.b+'</a> <a class="btn" href="'+B+(EN?"en/":"id/")+'">'+T.c+"</a></p>",T.h);game()}
/* game mini: pendaki berlari ke puncak. Lompat batu, merunduk di bawah burung; skor dalam mdpl */
function game(){
var c=document.getElementById("g");if(!c||!c.getContext)return;
var W=600,H=180,G=H-26,d=Math.min(window.devicePixelRatio||1,2),x=c.getContext("2d");c.width=W*d;c.height=H*d;x.scale(d,d);
var MT=[[2565,"Prau"],[2665,"Papandayan"],[2958,"Gede"],[3145,"Merbabu"],[3676,"Semeru"]];
var ink,br,y,v,o,nx,sp,sc,dx,dk,ms,mt,st=0,last=0,over=0,hi=0;try{hi=+localStorage.gwmhi||0}catch(e){}
function col(){ink=getComputedStyle(document.body).color;br=(getComputedStyle(document.documentElement).getPropertyValue("--brand")||"").trim()||"#0E5A46"}
function reset(){col();y=G;v=0;o=[];nx=320;sp=240;sc=0;dx=0;dk=0;ms="";mt=0}
function say(t,k){x.globalAlpha=1;x.fillStyle=ink;x.font="600 15px sans-serif";x.textAlign="center";x.fillText(t,W/2,k||64)}
function ridge(k,a,al,off){x.globalAlpha=al;x.fillStyle=br;x.beginPath();x.moveTo(0,G);for(var i=0;i<=W;i+=8){var t=(i+off)*k;x.lineTo(i,G-a*(.18+.6*Math.abs(Math.sin(t))+.22*Math.abs(Math.sin(t*2.3+1))))}x.lineTo(W,G);x.fill()}
function hiker(){var u=dk&&y>=G,f=y<G?5:Math.sin(sc*.5)*6;x.globalAlpha=1;x.strokeStyle=x.fillStyle=ink;x.lineWidth=3;x.lineCap="round";
 var h=u?10:22;x.beginPath();x.arc(u?55:51,y-h-5,4,0,7);x.fill();
 x.beginPath();x.moveTo(51,y-h);x.lineTo(u?47:51,y-(u?4:10));x.moveTo(51,y-(u?4:10));x.lineTo(51+f,y);x.moveTo(51,y-(u?4:10));x.lineTo(51-f,y);x.stroke();
 x.fillStyle=br;x.fillRect(u?42:44,y-h+1,6,u?8:10)}
function draw(){x.clearRect(0,0,W,H);
 x.globalAlpha=.6;x.fillStyle="#F2A33A";x.beginPath();x.arc(W-80,100-Math.min(sc/50,62),15,0,7);x.fill();
 ridge(.011,92,.12,dx*.08);ridge(.02,54,.2,dx*.25);
 x.globalAlpha=.3;x.fillStyle=ink;x.fillRect(0,G,W,1);for(var i=0;i<9;i++)x.fillRect(((i*80-dx)%W+W)%W,G+9,16,1.5);
 o.forEach(function(b){if(b.f){x.globalAlpha=1;x.fillStyle=ink;var w=Math.sin(dx*.05)*5;x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x+11,b.y-4-w);x.lineTo(b.x+22,b.y);x.lineTo(b.x+11,b.y-w*.3+2);x.fill()}
  else{x.globalAlpha=1;x.fillStyle=br;x.beginPath();x.moveTo(b.x,G);x.lineTo(b.x+b.w*.45,G-b.h);x.lineTo(b.x+b.w,G);x.fill()}});
 hiker();x.fillStyle=ink;x.globalAlpha=.9;x.font="13px sans-serif";x.textAlign="right";x.fillText((hi?T.hi+hi+" \u00b7 ":"")+Math.floor(sc)+" mdpl",W-8,18);
 if(ms&&Date.now()<mt){x.textAlign="left";x.fillText(ms,8,18)}
 if(st==0)say(T.go);if(st==2)say(T.oops);if(st==3)say(T.pz)}
function hit(){var hh=dk&&y>=G?14:28,top=y-hh;for(var i=0;i<o.length;i++){var b=o[i];
 if(b.f){if(58>b.x&&44<b.x+22&&top<b.y&&y>b.y-10)return 1}else if(58>b.x+b.w*.25&&44<b.x+b.w*.7&&y>G-b.h*.75)return 1}return 0}
function loop(ts){if(st!=1)return;var t=Math.min((ts-(last||ts))/1e3,.05);last=ts;
 v+=1500*t;y+=v*t;if(y>G){y=G;v=0}sp=Math.min(240+sc*.06,440);sc+=sp*t/3;dx+=sp*t;
 o.forEach(function(b){b.x-=sp*t});o=o.filter(function(b){return b.x>-40});nx-=sp*t;
 if(nx<=0){if(sc>250&&Math.random()<.3)o.push({x:W,f:1,y:G-24});else o.push({x:W,w:16+Math.random()*16,h:18+Math.random()*20});nx=300+Math.random()*240+sp*.4}
 for(var i=0;i<MT.length;i++)if(sc>=MT[i][0]&&MT[i][0]>(c._m||0)){c._m=MT[i][0];ms=T.ps+MT[i][1]+" "+MT[i][0]+" mdpl";mt=Date.now()+2500}
 if(hit()){st=2;over=Date.now();var s=Math.floor(sc);if(s>hi){hi=s;try{localStorage.gwmhi=s}catch(e){}}}
 draw();if(st==1)requestAnimationFrame(loop)}
function go(){reset();c._m=0;st=1;last=0;requestAnimationFrame(loop)}
function act(){if(st==1){if(y>=G)v=-540}else if(st==3){st=1;last=0;requestAnimationFrame(loop)}else if(Date.now()-over>400)go()}
function vis(){var r=c.getBoundingClientRect();return r.top<innerHeight&&r.bottom>0}
c.addEventListener("pointerdown",function(e){e.preventDefault();var r=c.getBoundingClientRect();if(st==1&&(e.clientY-r.top)/r.height>.6)dk=1;else act()});
["pointerup","pointercancel","pointerleave"].forEach(function(n){c.addEventListener(n,function(){dk=0})});
document.addEventListener("keydown",function(e){var k=e.code;if(k=="Space"||k=="ArrowUp"||k=="KeyW"){if(vis()||st==1){e.preventDefault();if(!e.repeat)act()}}else if(k=="ArrowDown"||k=="KeyS"){if(vis()||st==1){e.preventDefault();dk=1}}});
document.addEventListener("keyup",function(e){if(e.code=="ArrowDown"||e.code=="KeyS")dk=0});
document.addEventListener("visibilitychange",function(){if(document.hidden&&st==1){st=3;draw()}});
reset();draw()}
if(!M){notFound("");return}
var cat=M[2],slug=M[3];
if(!CN[cat]){notFound("");return}
show(cat,'<p class="bl-sub">Memuat tulisan…</p>',"Memuat…");
var s=document.createElement("script");s.src=B+"js/config.js";
s.onerror=function(){notFound(cat)};
s.onload=function(){
  var C=window.IB_CONFIG||{};if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){notFound(cat);return}
  var u=C.SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/blog_posts?select="+encodeURIComponent("title,slug,category,body,is_html,published_at")+"&status=eq.published&category=eq."+encodeURIComponent(cat)+"&slug=eq."+encodeURIComponent(slug)+"&limit=1";
  fetch(u,{headers:{apikey:C.SUPABASE_ANON_KEY,Authorization:"Bearer "+C.SUPABASE_ANON_KEY}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){
    var x=rows&&rows[0];if(!x){notFound(cat);return}
    var html=x.is_html?sanitize(x.body):t2h(x.body),words=html.replace(/<[^>]+>/g," ").split(/\s+/).filter(Boolean).length,mins=Math.max(1,Math.round(words/200));
    show(cat,'<nav class="bl-bc"><a href="'+B+'blog/">Blog</a> › <a href="'+B+'blog/'+cat+'/">'+esc(CN[cat])+"</a></nav><article><h1>"+esc(x.title)+'</h1><p class="bl-meta"><span>'+esc(CN[cat])+"</span> · <time>"+fd(x.published_at)+"</time> · "+mins+' menit baca</p><div class="bl-body">'+html+'</div></article><p class="bl-cta"><a class="btn" href="'+B+'id/event">Lihat event terbaru</a></p>',x.title);
    document.querySelector("main").className="wrap bl-main bl-art";
  }).catch(function(){notFound(cat)});
};
document.head.appendChild(s);
})();
</script></body></html>
