<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk — InfoBarengan</title><meta name="robots" content="noindex"><meta name="author" content="Jurkon Studio">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/panel.css">
</head><body>
<div class="top"><div class="wrap"><a class="logo" href="index.html"><img src="assets/favicon.svg" alt="">Info<b>Barengan</b></a><span class="sp"></span><a class="btn ghost sm" href="index.html">← Beranda</a></div></div>
<main class="wrap narrow">
<div id="msg" class="msg" hidden></div>
<div class="card" id="guest">
  <h3>Gabung komunitas barengan</h3><p>Masuk untuk membuat profil dan mencari teman seperjalanan.</p>
  <div class="seg"><button id="sLogin" class="on" type="button">Masuk</button><button id="sReg" type="button">Daftar</button></div>
  <form id="fLogin">
    <label class="f">Email<input id="lEmail" type="email" autocomplete="email" placeholder="nama@email.com" required></label>
    <label class="f">Password<input id="lPass" type="password" autocomplete="current-password" placeholder="Password kamu" required></label>
    <button class="btn block" type="submit">Masuk</button>
    <p style="text-align:center;margin:10px 0 0"><button class="lnk" id="lForgot" type="button">Lupa password?</button></p>
  </form>
  <form id="fReg" hidden>
    <label class="f">Nama panggilan<input id="rNick" type="text" maxlength="30" placeholder="contoh: Pendaki Dago" required></label>
    <label class="f">Email<input id="rEmail" type="email" autocomplete="email" placeholder="nama@email.com" required></label>
    <label class="f">Password (min. 8 karakter)<input id="rPass" type="password" minlength="8" autocomplete="new-password" placeholder="Buat password" required></label>
    <label class="chk"><input id="rConsent" type="checkbox"> Saya setuju dengan kebijakan privasi dan pemakaian lokasi untuk keamanan akun (UU PDP). Lokasi detail tidak ditampilkan ke pengguna lain.</label>
    <button class="btn block" type="submit">Buat akun</button>
  </form>
</div>

<div class="card" id="me" hidden>
  <div class="ph"><div class="av" id="av">?</div><div><h3 id="nm">Nama</h3><div class="meta" id="em"></div>
    <span class="badge ok" id="bv" hidden>✓ Terverifikasi</span> <span class="badge adm" id="ba" hidden>Admin</span></div></div>
  <div class="st"><div><b>0</b>event diikuti</div><div><b>0</b>teman barengan</div><div><b>0</b>ajakan dibuat</div></div>
  <form id="fProf">
    <label class="f">Nama panggilan<input id="pNick" type="text" maxlength="30" placeholder="Nama yang tampil ke pengguna lain"></label>
    <label class="f">Kota domisili<select id="pCity"></select></label>
    <button class="btn" type="submit">Simpan profil</button>
  </form>
  <div class="msg" style="margin-top:14px"><b>📍 Verifikasi lokasi</b><br><span id="locSt">Belum dicek. Lokasi dipakai untuk menjaga keamanan komunitas.</span><br><button class="btn ghost sm" id="bLoc" type="button" style="margin-top:6px">Izinkan &amp; cek lokasi</button></div>
  <div class="row" style="margin-top:12px"><a class="btn ghost" id="lAdmin" href="admin.html" hidden>Panel admin</a><button class="btn ghost" id="bOut" type="button">Keluar</button></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/supa.js"></script><script src="js/auth.js"></script>
</body></html>
