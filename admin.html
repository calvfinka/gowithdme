<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Admin — InfoBarengan</title><meta name="robots" content="noindex"><meta name="author" content="Jurkon Studio">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/panel.css">
</head><body>
<div class="top"><div class="wrap"><a class="logo" href="./"><img src="assets/favicon.svg" alt="">Info<b>Barengan</b> <span class="badge adm">Admin</span></a><span class="sp"></span><span class="meta" id="who"></span><a class="btn ghost sm" href="login">Profil</a></div></div>
<main class="wrap pg">
<div id="msg" class="msg" hidden></div>
<div class="card narrow" id="lock" hidden><h3>Akses dibatasi</h3><p id="lockT"></p><a class="btn" href="login">Ke halaman masuk</a></div>
<div class="adm" id="panel" hidden>
  <form class="card" id="fEv">
    <h3 id="fTitle">Postingan baru</h3><p>Isi info event dari sumber resmi. Poster milik penyelenggara, cantumkan akun sumbernya.</p>
    <div class="pv" id="pv">Pratinjau poster</div>
    <label class="f">Judul event<input id="f_title" type="text" maxlength="120" placeholder="contoh: Festival Musik Dago" required></label>
    <div class="g2">
      <label class="f">Kategori<select id="f_category"><option value="konser">Konser</option><option value="naikgunung">Naik Gunung</option></select></label>
      <label class="f">Kota<select id="f_city_id" required></select></label>
      <label class="f">Tanggal<input id="f_event_date" type="date" required></label>
      <label class="f">Harga<input id="f_price_label" type="text" placeholder="Gratis / Mulai Rp75 rb"></label>
    </div>
    <label class="f">Lokasi / venue<input id="f_venue" type="text" placeholder="Nama tempat atau basecamp"></label>
    <label class="f">Deskripsi<textarea id="f_description" placeholder="Ringkasan event, line-up, syarat, dan info penting lainnya"></textarea></label>
    <label class="f">Unggah poster (maks. 2 MB)<input id="f_file" type="file" accept="image/*"></label>
    <label class="f">atau URL poster<input id="f_poster_url" type="url" placeholder="https://…"></label>
    <label class="f">Link tiket / pendaftaran<input id="f_ticket_url" type="url" placeholder="https://…"></label>
    <div class="g2">
      <label class="f">Akun IG sumber<input id="f_source_ig" type="text" placeholder="@akunresmi"></label>
      <label class="f">Status<select id="f_status"><option value="draft">Draft</option><option value="published">Terbit</option></select></label>
    </div>
    <div class="row"><button class="btn" type="submit">Simpan</button><button class="btn ghost" id="bCancel" type="button" hidden>Batal edit</button></div>
  </form>
  <div class="card"><h3>Semua postingan (<span id="cnt">0</span>)</h3><p>Draft hanya terlihat oleh admin.</p>
    <div class="tw"><table class="tbl"><thead><tr><th>Judul</th><th>Kategori</th><th>Kota</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/supa.js"></script><script src="js/admin.js"></script>
</body></html>
