<!DOCTYPE html>
<html lang="{{lang}}">
<head>
{{>head}}<title>{{idx_title}}</title>
<meta name="description" content="{{idx_desc}}">
<meta property="og:title" content="{{og_title}}"><meta property="og:description" content="{{og_desc}}"><meta property="og:image" content="{{og_img}}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
{{hreflang}}</head>
<body>
{{>icons}}{{>bar}}
<div class="shell">
{{>side}}
<main class="main">
  <section class="khero">
    <div><h1 id="evTitle">{{home_h}}</h1><p>{{home_p}}</p>
      <div class="row"><a class="btn" href="komunitas">{{home_cta}}</a><a class="btn line" href="event?ajakan=1">{{home_cta2}}</a></div></div>
    <div class="kchips" id="kChips" role="group" aria-label="{{home_chips_aria}}"></div>
  </section>
  <div class="head">
    <div><h2 id="nowH">{{home_now_h}}</h2><p>{{home_now_p}}</p></div>
    <div class="hx"><select class="sel" id="city" aria-label="{{aria_city}}"></select>{{>view}}</div>
  </div>
  {{>now}}
  <div class="mfilters" id="mCat" role="group" aria-label="{{aria_kind}}"></div>
  {{>stats}}
  <section class="tick" id="tick" aria-label="{{tick_aria}}" hidden><div class="tl">{{tick_h}}</div><div class="vp"><div class="trk" id="trk"></div></div></section>
  <p class="note" id="note" hidden>{{home_note}}</p>
  <div id="list"><div class="group"><div class="tiles"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></div>
  <p style="margin:18px 0 0"><a class="btn line" href="event">{{see_filter}}</a></p>
  <div class="info">
    <div><b>{{f1_h}}</b><span>{{f1_p}}</span></div>
    <div><b>{{f2_h}}</b><span>{{f2_p}}</span></div>
    <div><b>{{f3_h}}</b><span>{{f3_p}}</span></div>
  </div>
  {{>foot}}
</main>
</div>
<dialog id="dlg"><div id="dBody"></div></dialog>
<div id="toast" role="status"></div>
{{>libs}}<script>window.IB_MODE="home"</script><script src="../js/share.js"></script><script src="../js/ajakan.js"></script><script src="../js/forum-event.js"></script><script src="../js/now.js"></script><script src="../js/app.js"></script>
</body>
</html>
