<select class="sel" id="city" aria-label="{{aria_city}}"></select>
<select class="sel" id="when" aria-label="{{aria_when}}"><option value="semua">{{w_all}}</option><option value="live">{{w_live}}</option><option value="week">{{next7}}</option><option value="month">{{w_30}}</option></select>
<select class="sel" id="price" aria-label="{{aria_price}}"><option value="semua">{{p_all}}</option><option value="gratis">{{p_free}}</option><option value="bayar">{{p_paid}}</option></select>
<select class="sel" id="sort" aria-label="{{aria_sort}}"><option value="date">{{s_near}}</option><option value="new">{{s_new}}</option></select>
<button class="btn line sm" id="reset" type="button">{{reset}}</button>
