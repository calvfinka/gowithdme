<!DOCTYPE html>
<html lang="{{lang}}">
<head>
{{>head}}<title>{{gn_title}}</title>
<meta name="description" content="{{gn_desc}}">
<meta property="og:title" content="{{og_title}}"><meta property="og:description" content="{{og_desc}}"><meta property="og:image" content="{{og_img}}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
{{hreflang}}</head>
<body>
{{>icons}}{{>bar}}
<div class="shell">
{{>side}}
<main class="main">
  <div class="head">
    <div><h1 id="evTitle">{{gn_h}}</h1><p>{{gn_p}}</p></div>
    <div class="hx">{{>filters}}{{>view}}</div>
  </div>
  {{>now}}
  <div class="mfilters" id="mCat" role="group" aria-label="{{aria_kind}}"></div>
  {{>stats}}
  <div class="cnt" id="cnt" aria-live="polite"></div>
  <div id="list"><div class="group"><div class="tiles"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></div>
  <section class="group tools-g" id="tools">
    <h2>{{tools_h}}</h2><p class="meta" style="margin:-6px 0 12px">{{tools_p}}</p>
    <div class="cards">
      <div class="card"><h3>{{pack_h}}</h3><p>{{pack_p}}</p>
        <div class="prog"><i id="pbar"></i></div><div class="meta" id="pcount"></div><ul class="pl" id="pl"></ul>
        <button class="btn line sm" id="pReset" type="button" style="margin-top:8px">{{reset}}</button></div>
      <div class="card"><h3>{{split_h}}</h3><p>{{split_p}}</p>
        <div class="form">
          <label>{{l_total}}<input id="total" type="number" min="0" inputmode="numeric" placeholder="{{ph_total}}"></label>
          <label>{{l_people}}<input id="orang" type="number" min="1" inputmode="numeric" value="4"></label>
          <label>{{l_buffer}}<input id="admin" type="number" min="0" max="30" inputmode="numeric" value="5"></label>
          <label>{{l_host_fee}}<input id="hostFee" type="number" min="0" max="25" inputmode="numeric" value="0"></label>
        </div><div class="res" id="hasil"></div></div>
    </div>
  </section>
  {{>foot}}
</main>
</div>
<dialog id="dlg"><div id="dBody"></div></dialog>
<div id="toast" role="status"></div>
{{>libs}}<script>window.IB_MODE="gunung"</script><script src="../js/share.js"></script><script src="../js/safety-core.js"></script><script src="../js/ajakan.js"></script><script src="../js/forum-event.js"></script><script src="../js/now.js"></script><script src="../js/app.js"></script><script src="../js/tools.js"></script>
</body>
</html>
