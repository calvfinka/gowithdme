<!DOCTYPE html>
<html lang="{{lang}}"><head>
{{>head}}<title>{{sb_title}}</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="../css/panel.css">
{{hreflang}}</head><body>
{{>icons}}{{>bar}}
<main class="page sub">
<div id="msg" class="msg" hidden></div>
<div class="card narrow" id="guest" hidden><h3>{{sb_login_h}}</h3><p>{{sb_login_p}}</p><a class="btn" href="login">{{sb_login_btn}}</a></div>
<div id="wrap" hidden>
  <h1>{{sb_h}}</h1><p class="meta">{{sb_p}}</p>
  <form id="fSub">
    <div class="kind k3" id="kind" role="group" aria-label="{{sb_kind_aria}}">
      <button type="button" data-kind="konser" class="on"><svg class="i" aria-hidden="true"><use href="#i-mic"/></svg><span>{{sb_k_konser}}</span></button>
      <button type="button" data-kind="pameran"><svg class="i" aria-hidden="true"><use href="#i-bag"/></svg><span>{{sb_k_pameran}}</span></button>
      <button type="button" data-kind="naikgunung"><svg class="i" aria-hidden="true"><use href="#i-mtn"/></svg><span>{{sb_k_trip}}</span></button>
    </div>
    <fieldset class="fs"><legend>{{sb_f1}}</legend>
      <label class="pv drop" id="pv" for="a_file">{{sb_drop}}</label>
      <input class="sr" id="a_file" type="file" accept="image/jpeg,image/png,image/webp">
    </fieldset>
    <fieldset class="fs"><legend>{{sb_f2}}</legend>
      <label class="f"><span>{{sb_l_title}} <i class="req">*</i></span><input id="a_title" type="text" minlength="5" maxlength="120" required></label>
      <div class="g2">
        <label class="f"><span>{{sb_l_city}} <i class="req">*</i></span><select id="a_city" required></select></label>
        <label class="f">{{sb_l_price}}<input id="a_price" type="text" maxlength="60" placeholder="{{sb_ph_price}}"></label>
        <label class="f"><span><span id="lStart">{{sb_l_start}}</span> <i class="req">*</i></span><input id="a_start" type="date" required></label>
        <label class="f"><span id="lEnd">{{sb_l_end}}</span><input id="a_end" type="date"></label>
      </div>
      <label class="f"><span id="lVenue">{{sb_l_venue}}</span><input id="a_venue" type="text" maxlength="120"></label>
      <label class="f"><span>{{sb_l_org}} <i class="req">*</i></span><input id="a_org" type="text" maxlength="80" required></label>
      <p class="meta" style="margin:-4px 0 10px">{{sb_org_hint}}</p>
    </fieldset>
    <fieldset class="fs" data-for="konser"><legend>{{sb_f3k}}</legend>
      <label class="f">{{sb_l_genre}}<select id="a_genre"></select></label>
      <label class="f">{{sb_l_lineup}}<textarea id="a_lineup" maxlength="500" placeholder="{{sb_ph_lineup}}"></textarea></label>
    </fieldset>
    <fieldset class="fs" data-for="naikgunung" hidden><legend>{{sb_f3t}}</legend>
      <label class="f"><span>{{sb_l_mtn}} <i class="req">*</i></span><input id="a_mountain" type="text" maxlength="80" placeholder="{{sb_ph_mtn}}"></label>
      <p class="meta" style="margin:-4px 0 10px">{{sb_mtn_hint}}</p>
      <div class="g2">
        <label class="f">{{sb_l_alt}}<input id="a_alt" type="number" min="0" max="6000" inputmode="numeric"></label>
        <label class="f">{{sb_l_dif}}<select id="a_dif"></select></label>
        <label class="f">{{sb_l_dur}}<input id="a_dur" type="text" maxlength="40" placeholder="{{sb_ph_dur}}"></label>
        <label class="f"><span>{{sb_l_quota}} <i class="req">*</i></span><input id="a_quota" type="number" min="1" max="500" inputmode="numeric"></label>
      </div>
      <label class="f">{{sb_l_wa}}<input id="a_wa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx"></label>
    </fieldset>
    <fieldset class="fs"><legend>{{sb_f4}}</legend>
      <label class="f"><span>{{sb_l_desc}} <i class="cc" id="ccDesc">0</i></span><textarea id="a_desc" maxlength="2000" placeholder="{{sb_ph_desc}}"></textarea></label>
      <label class="f">{{sb_l_ticket}}<input id="a_ticket" type="url" maxlength="500" placeholder="https://…"></label>
      <label class="f">{{sb_l_ig}}<input id="a_ig" type="text" maxlength="31" placeholder="@akunresmi"></label>
    </fieldset>
    <fieldset class="fs"><legend>{{sb_f5}}</legend>
      <label class="f">{{sb_promo_tier}}<select id="a_promo"></select></label>
      <p class="meta" id="aPromoEst" style="margin:-4px 0 4px"></p>
      <p class="meta" style="margin:0">{{sb_promo_note}}</p>
    </fieldset>
    <label class="chk"><input id="a_ok" type="checkbox"> <span>{{sb_consent}}</span></label>
    <button class="btn block" id="a_send" type="submit">{{sb_submit}}</button>
    <p class="meta" style="text-align:center;margin-top:8px">{{sb_review_note}}</p>
  </form>
  <section id="mineBox" style="margin-top:28px"><h2>{{sb_mine_h}}</h2><div id="mine"></div></section>
</div>
{{>foot}}
</main>
<div id="toast" role="status"></div>
{{>libs}}<script src="../js/gunung-data.js"></script><script src="../js/share.js"></script><script src="../js/suggest-core.js"></script><script src="../js/suggest.js"></script><script src="../js/ajukan.js"></script>
</body></html>
